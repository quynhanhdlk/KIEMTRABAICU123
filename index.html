<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Kiểm Tra Bài Cũ Thông Minh</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- PubNub SDK -->
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.4.5.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Times+New+Roman&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #fdf2f8; }
        ::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 9999px; }
        
        .camera-container-box {
            position: relative !important;
            width: 100% !important;
            height: 180px !important;
            max-height: 180px !important;
            background: #000000 !important;
            border-radius: 1rem !important;
            overflow: hidden !important;
            contain: strict !important;
        }
        .camera-video-player {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            pointer-events: none !important;
            -webkit-user-select: none !important;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-rose-50 to-pink-200 min-h-screen flex items-center justify-center p-3 sm:p-5 select-none">

    <div id="app-container" class="w-full max-w-xl bg-white/95 backdrop-blur-sm rounded-3xl shadow-2xl p-4 sm:p-8 border border-pink-200/60 transition-all duration-300">
        
        <!-- MÀN HÌNH CHÍNH -->
        <div id="screen-main" class="space-y-4 text-center py-2">
            <div class="inline-flex p-3 sm:p-4 rounded-3xl bg-pink-100/80 text-pink-600 shadow-inner">
                <span class="text-4xl sm:text-5xl animate-bounce">🧪</span>
            </div>
            
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-pink-600 tracking-tight">KIỂM TRA BÀI CŨ</h1>
                <p class="text-xs sm:text-sm text-gray-500 mt-1 font-medium">Hỏi đáp trực tiếp bằng Camera & Giọng nói</p>
                <div class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold bg-green-100 text-green-700">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    <span>Đồng bộ máy chủ đa thiết bị sẵn sàng</span>
                </div>
            </div>

            <!-- CẤP QUYỀN CAMERA SỚM -->
            <div id="device-perm-box" class="bg-gradient-to-r from-pink-50 to-rose-50 p-3 sm:p-4 rounded-2xl border-2 border-dashed border-pink-300 text-left space-y-2">
                <div class="flex items-center justify-between">
                    <span class="font-bold text-xs text-pink-800 flex items-center gap-1.5">
                        <span>🎥</span> <span>Bước 1: Kích hoạt Camera</span>
                    </span>
                    <span id="perm-badge" class="text-[10px] bg-amber-100 text-amber-700 font-bold px-2.5 py-1 rounded-full">Chờ cấp quyền</span>
                </div>
                <p class="text-[11px] text-gray-600 leading-relaxed">
                    Bấm nút bên dưới và chọn <b>"Cho phép"</b> để bật camera phục vụ giám sát khi làm bài.
                </p>
                <div class="pt-1">
                    <button type="button" id="btn-request-early-perm" onclick="requestDeviceAccessEarly()" class="w-full py-2.5 px-4 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center justify-center gap-2">
                        <span>🔓</span> Kích hoạt Camera ngay
                    </button>
                </div>
            </div>
            
            <div class="space-y-3 pt-1 max-w-md mx-auto">
                <button type="button" onclick="navigateTo('screen-teacher-login')" class="w-full py-3 sm:py-3.5 px-6 bg-pink-500 hover:bg-pink-600 text-white font-bold text-sm sm:text-base rounded-2xl shadow-lg shadow-pink-500/25 transition flex items-center justify-center gap-3">
                    <span class="text-xl">👩‍🏫</span> DÀNH CHO GIÁO VIÊN
                </button>
                
                <button type="button" onclick="navigateTo('screen-student-login')" class="w-full py-3 sm:py-3.5 px-6 bg-rose-500 hover:bg-rose-600 text-white font-bold text-sm sm:text-base rounded-2xl shadow-lg shadow-rose-500/25 transition flex items-center justify-center gap-3">
                    <span class="text-xl">🎒</span> DÀNH CHO HỌC SINH
                </button>
            </div>
        </div>

        <!-- ĐĂNG NHẬP GIÁO VIÊN -->
        <div id="screen-teacher-login" class="hidden space-y-4">
            <div class="flex items-center justify-between border-b border-pink-100 pb-3">
                <h2 class="text-lg sm:text-xl font-bold text-pink-600 flex items-center
